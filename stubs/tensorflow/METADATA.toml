# Using an exact number in the specifier for scripts/sync_protobuf/tensorflow.py
# When updating, also re-run the script
# requires a version of numpy with a `py.typed` file
version = "~=2.21.0"
upstream-repository = "https://github.com/tensorflow/tensorflow"
dependencies = ["numpy>=1.20", "types-protobuf", "requests>=2.34.0"]
extra-description = "Partially generated using [mypy-protobuf==5.1.0](https://github.com/nipunn1313/mypy-protobuf/tree/v5.1.0) and libprotoc 35.1 on `tensorflow==2.21.0`."
partial-stub = true

[tool.stubtest]
ignore-missing-stub = true
stubtest-dependencies = ["keras==3.15.*"]
